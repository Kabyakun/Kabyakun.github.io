{{ define "main" }}
<h1 style="margin-bottom:0.5rem;">News</h1>
<hr style="margin-bottom:2rem;">

<table style="width: 100%; border-collapse: collapse;">
  {{ range .Pages }}
  <tr style="border-bottom: 1px solid rgba(255,255,255,0.07);">
    <td style="padding: 0.6rem 1.5rem 0.6rem 0; white-space: nowrap; font-weight: bold; opacity: 0.7; vertical-align: top;">
      {{ .Date.Format "Jan 2006" }}
    </td>
    <td style="padding: 0.6rem 0;">{{ .Params.summary | markdownify }}</td>
  </tr>
  {{ end }}
</table>
{{ end }}
